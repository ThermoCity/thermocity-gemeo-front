# Build do front (Vite) e publicação no Azure Web App thermocity.
# As variáveis VITE_* entram no JavaScript na hora do build: não coloque segredos aqui.

name: Build and deploy front to Azure Web App - thermocity

on:
  push:
    branches:
      - main
  pull_request:          # PR para a main: roda só o build (validação, sem deploy)
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'thermocity'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_TERRITORIO_URL: 'https://thermocity-base-territorial-api-v2.azurewebsites.net'
          VITE_USE_MOCKS_TERRITORIO: 'false'
          VITE_USE_MOCKS: 'false'      # false = usa as APIs reais de cadastro e clima
          VITE_API_JAVA_URL: 'https://thermocity-cadastro-api-v2.azurewebsites.net'
          VITE_API_CLIMA_URL: 'https://thermocity-weather-api-v2.azurewebsites.net'
          VITE_API_TIMEOUT_MS: '90000'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: front
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: front

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
